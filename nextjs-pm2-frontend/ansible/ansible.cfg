# Run ansible-playbook from this folder (nextjs-pm2-frontend/ansible), connected to the VPN.
[defaults]
inventory = inventory.aws_ec2.yml
remote_user = ubuntu
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = False

[inventory]
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
# Servers are replaced now and then; accept a new server's key once, refuse a changed one.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
